name: Deploy avagent-eval website

on:
  push:
    branches: [main]
    paths:
      - 'web_app/**'
      - 'paper_site/**'
      - 'scripts/fetch_paper_examples.py'
      - 'tests/test_paper_examples.py'
      - 'av_eval/web_*.py'
      - 'tests/test_web_*.py'
      - 'tests/test_web_events.mjs'
      - 'tests/test_web_render.mjs'
      - 'scripts/configure_github_access.py'
      - 'scripts/configure_ngrok_access.py'
      - 'tests/test_configure_github_access.py'
      - 'tests/test_configure_ngrok_access.py'
      - 'tests/fixtures/web_runner.py'
      - 'requirements-web.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - name: Set up FFmpeg and ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Bundled static tools avoid external binary download hooks and apt mirrors.
            npm install --prefix "$RUNNER_TEMP/media-tools" --ignore-scripts --no-audit --no-fund \
              @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            tools="$RUNNER_TEMP/media-tools/node_modules"
            chmod +x "$tools/@ffmpeg-installer/linux-x64/ffmpeg" "$tools/@ffprobe-installer/linux-x64/ffprobe"
            echo "$tools/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
            echo "$tools/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
            export PATH="$tools/@ffmpeg-installer/linux-x64:$tools/@ffprobe-installer/linux-x64:$PATH"
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m unittest discover -s tests -p 'test_web_api.py' -v
      - run: python -m unittest discover -s tests -p 'test_web_app.py' -v
      - run: node --check web_app/app.js
      - run: node --test tests/test_web_events.mjs
      - run: node --test tests/test_web_render.mjs
      - run: python -m unittest discover -s tests -p 'test_configure_ngrok_access.py' -v
      - run: python -m unittest discover -s tests -p 'test_configure_github_access.py' -v
      - run: python -m unittest discover -s tests -p 'test_paper_examples.py' -v
      - name: Assemble paper site and existing evaluation app
        run: |
          mkdir -p _site/eval _site/assets
          cp -a web_app/. _site/eval/
          cp -a paper_site/. _site/
          python scripts/fetch_paper_examples.py --output _site/assets
          python scripts/fetch_paper_examples.py --manifest paper_site/project-video-media.json --output _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
